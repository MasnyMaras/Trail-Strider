name: trail-strider                      # nazwa projektu - prefiks kontenerów i wolumenów

services:
  db:
    #image: postgis/postgis:18-3.6        # stała wersja, nie "latest" - wszyscy mają to samo 
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677   # przypięty skrót = dokładnie ta kompilacja
    environment:
      POSTGRES_USER: ${POSTGRES_USER}    # wartości z pliku .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"            # tylko z tego komputera, nie z sieci (lewa strona = localhost, prawa strona = kontener)
    volumes:
      - pgdata:/var/lib/postgresql       # dane bazy przeżyją usunięcie kontenera
    healthcheck:                         # Docker co 10 s sprawdza, czy baza przyjmuje połączenia
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s                      # co ile sprawdzać
      timeout: 5s                        # dłużej = porażka
      retries: 5                         # tyle porażek z rzędu = unhealthy
      start_period: 30s                  # czas na rozruch: porażki się nie liczą

  osm2pgsql:
    #image: iboates/osm2pgsql:2.3.1       # przypięta wersja
    image: iboates/osm2pgsql:2.3.1@sha256:6548a1e2492e08fa0d5ce987d382ad57c4b21c8a94ff00017c6109770a061b79   # przypięty skrót = dokładnie ta kompilacja
    profiles: ["tools"]                  # NIE startuje przy "docker compose up" - tylko na żądanie
    depends_on:
      - db
    environment:
      PGHOST: db                         # adres bazy = nazwa usługi w sieci projektu
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./data:/data:ro                  # pliki PBF widoczne w kontenerze jako /data
      #- ./osm2pgsql:/config:ro           # konfiguracje Lua widoczne jako /config (stara struktura, do usuniecia)
      - ./db/osm2pgsql:/config:ro        # konfiguracje Lua widoczne jako /config (tylko odczyt)
  brouter:
    image: ghcr.io/abrensch/brouter:nightly # brouter ready image from git
    restart: unless-stopped
    ports:
      - "127.0.0.1:17777:17777"             # localhost not web, default http port for BRouter
    volumes:
      - type: bind
        source: ./routing/segments4
        target: /segments4
        read_only: true
    environment:
      MAXTHREADS: "2"
      JAVA_OPTS: "-Xmx128M -Xms128M -Xmn8M -DmaxRunningTime=10 -DuseRFCMimeType=false"
    # brouter config parameters based on: 
    # https://github.com/abrensch/brouter/blob/master/README.md
    # https://zod.github.io/brouter/developers/docker_guide.html
  backend:
    build: ./backend                     # obraz budowany z backend/Dockerfile
    command: ["fastapi", "run", "app/main.py", "--port", "8000", "--reload"]   # jak CMD Dockerfile + przeładowanie (tylko do pracy lokalnej)
    ports:
      - "127.0.0.1:8000:8000"            # tylko z tego komputera
    volumes:
      - ./backend/app:/code/app:ro       # kod z repo widoczny w kontenerze (tylko odczyt)
    environment:
      PGHOST: db                         # adres bazy = nazwa usługi w sieci projektu
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}         # wartości z pliku .env
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy       # backend startuje dopiero, gdy baza jest (healthy)
    healthcheck:                         # Docker co 30 s pyta /api/health z wnętrza kontenera
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  routing:
    build: ./routing                     # obraz budowany z routing/Dockerfile
    command: ["fastapi", "run", "app/main.py", "--port", "8000", "--reload"]   # jak CMD + przeładowanie (tylko lokalnie)
    ports:
      - "127.0.0.1:8001:8000"            # localhost: 8001 → kontener: 8000
    volumes:
      - ./routing/app:/code/app:ro       # kod z repo widoczny w kontenerze (tylko odczyt)
    environment:
      BROUTER_URL: http://brouter:17777/brouter   # BRouter po nazwie usługi w sieci projektu
    depends_on:
      - brouter                          # krótka forma: brouter nie ma healthchecku
    healthcheck:                         # Docker co 30 s pyta /health z wnętrza kontenera
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
