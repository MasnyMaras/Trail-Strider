# Konfiguracja serwera kafli Martin (Trail-Strider).
# Ścieżki widziane z wnętrza kontenera: /tiles = data/tiles, /map = map (wolumeny w compose.yaml).

# brakujące źródło (np. nie uruchomiono db/sql/map_regions.sql) = ostrzeżenie w logach zamiast zatrzymania Martina
on_invalid: warn

# źródła z bazy: tylko jawnie wymienione tabele (bez automatycznego publikowania całej bazy)
postgres:
  connection_string: ${MARTIN_DATABASE_URL}   # zmienna ustawiana w compose.yaml, hasło nie trafia do repo
  auto_publish: false
  tables:
    map_mask:                  # nazwa źródła = adres http://localhost:3000/map_mask
      schema: app
      table: map_mask
      srid: 3857
      geometry_column: geom
      bounds: [-180, -85.0511, 180, 85.0511]   # cały świat; liczone automatycznie wychodzą odwrócone (zawinięcie długości przy 180°)
    map_regions:
      schema: app
      table: map_regions
      srid: 3857
      geometry_column: geom
      properties:
        name: text             # do kafli trafia tylko nazwa regionu
    trails:                    # szlaki piesze (db/sql/trails.sql)
      schema: app
      table: trails
      srid: 3857
      geometry_column: geom
      properties:
        name: text
        color: text            # kolor szlaku (red, blue, ...; pusty = brak koloru)
    trail_segments:            # szlaki pocięte na wspólne odcinki (db/sql/trails.sql)
      schema: app
      table: trail_segments
      srid: 3857
      geometry_column: geom
      buffer: 256                # zapas danych zza krawędzi kafla (domyślnie 64): przesunięte linie nie urywają się
      properties:
        color: text
        i: int4                # numer koloru na odcinku (1..n)
        n: int4                # liczba kolorów na odcinku
    noclegi:                   # noclegi (db/sql/noclegi.sql)
      schema: app
      table: noclegi
      srid: 3857
      geometry_column: geom
      id_column: id            # id obiektu w kaflu (podświetlanie w przeglądarce); zmienia się po przebudowie tabeli
      properties:              # pola do rysowania i do okienka po kliknięciu
        zrodlo: text
        rodzaj: text
        nazwa: text
        super: bool
        woda_rodzaj: text
        woda_odl_m: float4
        www: text
        telefon: text
    miejsca:                   # ciekawe miejsca: szczyty, przełęcze, doliny itd. (db/sql/miejsca.sql)
      schema: app
      table: miejsca
      srid: 3857
      geometry_column: geom
      id_column: id
      properties:
        rodzaj: text
        nazwa: text
        wysokosc: int4  

# podkład: każdy plik *.mbtiles z folderu to osobne źródło (nazwa = nazwa pliku)
mbtiles:
  paths:
    - /tiles

# PMTiles nie używamy; jawne ustawienie usuwa ostrzeżenie "Defaulting pmtiles.allow_http"
pmtiles:
  allow_http: false

fonts:
  paths:
    - /map/fonts

sprites:
  paths:
    - /map/sprites/ofm         # nazwa zestawu ikon = nazwa folderu (ofm)
    - /map/sprites/noclegi     # własne ikony noclegów (np. campsite_wild – „Zanocuj w lesie” i dziko)

styles:
  paths:
    - /map/styles              # nazwa stylu = nazwa pliku (liberty)
